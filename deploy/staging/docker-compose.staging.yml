name: socialflow-staging

x-app-environment: &app-environment
  NODE_ENV: staging
  MAIN_URL: https://${STAGING_HOSTNAME}
  FRONTEND_URL: https://${STAGING_HOSTNAME}
  NEXT_PUBLIC_BACKEND_URL: https://${STAGING_HOSTNAME}/api
  BACKEND_INTERNAL_URL: http://backend:3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  JWT_SECRET: ${JWT_SECRET}
  SOCIAL_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${SOCIAL_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID}
  SOCIAL_CREDENTIAL_ENCRYPTION_KEYS: '${SOCIAL_CREDENTIAL_ENCRYPTION_KEYS}'
  AUDIT_IP_HMAC_KEY: ${AUDIT_IP_HMAC_KEY}
  STORAGE_PROVIDER: local
  UPLOAD_DIRECTORY: /uploads
  NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: /uploads
  REMOTE_MEDIA_MAX_BYTES: '67108864'
  DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
  ENABLE_TEST_PROVIDER: ${ENABLE_TEST_PROVIDER:-true}
  SOCIAL_PROVIDER_ALLOWLIST: ''
  ALLOW_MCP_URL_SECRETS: ''
  ALLOW_STRIPE_LIVE_MODE: ''
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_SIGNING_KEY: ${STRIPE_SIGNING_KEY:-}
  API_LIMIT: '30'
  IS_GENERAL: 'true'
  NX_ADD_PLUGINS: 'false'

x-app-service: &app-service
  image: ${SOCIALFLOW_IMAGE}
  restart: unless-stopped
  environment: *app-environment
  networks: [edge, private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: 'false'
      SKIP_DEFAULT_NAMESPACE_CREATION: 'false'
      TEMPORAL_ADDRESS: temporal:7233
    networks: [private]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'temporal operator cluster health --address "$$TEMPORAL_ADDRESS" | grep -q SERVING',
        ]
      interval: 15s
      timeout: 8s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  migrate:
    <<: *app-service
    restart: 'no'
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    command: [pnpm, prisma-migrate-deploy]

  backend:
    <<: *app-service
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    command: [pnpm, start:prod:backend]
    volumes:
      - ${UPLOAD_HOST_PATH}:/uploads
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/monitor/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 12

  orchestrator:
    <<: *app-service
    mem_limit: 1536m
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command: [pnpm, start:prod:orchestrator]
    volumes:
      - ${UPLOAD_HOST_PATH}:/uploads
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 12s
      retries: 12

  frontend:
    <<: *app-service
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [pnpm, start:prod:frontend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4200/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 12

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${UPLOAD_HOST_PATH}:/uploads:ro
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
