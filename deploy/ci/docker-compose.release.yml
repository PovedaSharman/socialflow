name: socialflow-release-gate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: socialflow
      POSTGRES_PASSWORD: socialflow-test-only
      POSTGRES_DB: socialflow_test
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U socialflow -d socialflow_test']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: socialflow
      POSTGRES_PWD: socialflow-test-only
      POSTGRES_SEEDS: postgres
      DBNAME: temporal_test
      VISIBILITY_DBNAME: temporal_visibility_test
      ENABLE_ES: 'false'
    ports: ['127.0.0.1:7233:7233']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'temporal operator cluster health --address "$$TEMPORAL_ADDRESS" | grep -q SERVING',
        ]
      interval: 10s
      timeout: 8s
      retries: 30
