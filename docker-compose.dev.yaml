name: socialflow-dev

# Local dependencies only. Application processes run from the checked-out
# source using Node selected by .nvmrc.
services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz-local
      POSTGRES_PASSWORD: postiz-local-pwd
      POSTGRES_DB: postiz-db-local
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-local -d postiz-db-local']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    mem_limit: 256m
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.30.3
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  temporal-postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 3s
      retries: 12

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    mem_limit: 512m
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.security.enabled: 'false'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9200/_cluster/health >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 18

  temporal:
    image: temporalio/auto-setup:1.28.1
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      ENABLE_ES: 'true'
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'tctl --address "$$(hostname -i):7233" cluster health']
      interval: 10s
      timeout: 5s
      retries: 18

  temporal-ui:
    image: temporalio/ui:2.34.0
    mem_limit: 256m
    restart: unless-stopped
    profiles: ['tools']
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4200
    ports:
      - '${TEMPORAL_UI_PORT:-8080}:8080'

  pgadmin:
    image: dpage/pgadmin4:9
    mem_limit: 512m
    restart: unless-stopped
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: developer@localhost.invalid
      PGADMIN_DEFAULT_PASSWORD: local-development-only
    ports:
      - '${PGADMIN_PORT:-8081}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redisinsight:
    image: redis/redisinsight:2.68
    mem_limit: 512m
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '${REDISINSIGHT_PORT:-5540}:5540'
    volumes:
      - redisinsight-data:/data

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
  temporal-postgres-data:
  temporal-elasticsearch-data:
  pgadmin-data:
  redisinsight-data:
